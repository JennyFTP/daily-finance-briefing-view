:root{color-scheme:light;--bg:hsl(210 20% 98%);--card:#fff;--muted:hsl(210 15% 93%);--muted-fg:hsl(220 10% 45%);--fg:hsl(220 25% 10%);--fg2:hsl(220 25% 25%);--border:hsl(210 20% 90%);
 --primary:hsl(199 89% 48%);--primary-fg:#fff;--accent:hsl(199 70% 94%);--accent-fg:hsl(199 89% 35%);

<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const D = P.data, H = P.history;
const LV = {0:['●','정상'],1:['▲','주의'],2:['■','경고']};
const PH = {'안정':0,'주의':1,'경고':2};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toggleTheme(){
  const r=document.documentElement; const cur=r.getAttribute('data-theme');
  const dark = cur==='dark';
  r.setAttribute('data-theme', dark?'light':'dark'); localStorage.setItem('theme', dark?'light':'dark');
}
const saved = localStorage.getItem('theme'); if (saved) document.documentElement.setAttribute('data-theme', saved);

$('date').textContent = D.run_date.replace(/-/g,'.') + ' 기준 · 매일 07:00 갱신';
const pl = PH[D.phase]; $('phase-card').classList.add('lv'+pl); $('phase').innerHTML = `<span class="badge lv${pl}" style="font-size:15px;padding:4px 12px">${LV[pl][0]} ${D.phase}</span>`;
$('score').textContent = D.score;
$('layers').innerHTML = ['경기','유동성','심리'].map(L => `<div><b>${L}</b><span>${esc(D.layer_labels[L])}</span></div>`).join('');
$('alerts').innerHTML = D.alerts.map(a => `<div class="alert">⚠ ${esc(a.name)}<small>${esc(a.meaning)}</small></div>`).join('');

const stageNames = ['TGA 급증','RRP 충분','RRP 바닥','자금 부족','회복'];
$('steps').innerHTML = stageNames.map((n,i) => `<div class="${D.liquidity_stage===i+1?'on s'+(i+1):''}"><b>${i+1}</b>${n}</div>`).join('');
$('stage-note').textContent = (D.liquidity_stage ? D.liquidity_stage+'단계 · ' : '단계 미해당 · ') + D.liquidity_note;

$('changes').innerHTML = D.changes.length ? D.changes.map(c => `<li>${esc(c)}</li>`).join('') : '<li class="note">없음 (레벨 변화·눈에 띄는 변동 없음)</li>';
$('watch').innerHTML = D.watch.length ? D.watch.map(c => `<li>${esc(c)}</li>`).join('') : '<li class="note">특이 일정 없음</li>';

$('sections').innerHTML = ['경기','유동성','심리'].map(L => {
  const tiles = D.signals.filter(s => s.layer===L).map(s => `
    <div class="tile lv${s.level}" onclick="this.classList.toggle('open')">
      <div class="n">${esc(s.name)}<em>${esc(s.basis)}</em></div>
      <div class="v">${esc(s.display)}</div>
      <span class="badge lv${s.level}">${LV[s.level][0]} ${LV[s.level][1]}</span>${s.note?'<div class="s">'+esc(s.note)+'</div>':''}
      <div class="d"><b>${esc(s.full)}</b> — ${esc(s.desc)}<br>기준선: ${esc(s.threshold)}${s.prev_value!=null?'<br>직전: '+esc(fmtPrev(s))+' ('+esc(s.prev_date||'')+')':''}</div>
    </div>`).join('');
  return `<section class="card"><h2>${L}<small>${esc(D.layer_labels[L])}</small></h2><div class="grid">${tiles}</div></section>`;
}).join('');
function fmtPrev(s){ const v=s.prev_value; if (v==null) return '-'; if (['tga','reserves','margin_debt'].includes(s.key)) return (v/1000).toFixed(2)+'조'; if (s.key==='rrp') return (v*10).toFixed(v<1?1:0)+'억'; return typeof v==='number'? (Math.round(v*100)/100).toString() : v; }

// ---- 30일 점수 차트 (단일 계열 막대, 상태 구간 가이드선) ----
(function(){
  const el=$('chart'); const W=480, Hh=120, padL=24, padB=18, padT=8; const maxY=24;
  const rows=H.length?H:[{date:D.run_date,score:D.score,phase:D.phase}];
  const n=Math.max(rows.length,1); const bw=Math.max(4,Math.min(18,(W-padL-8)/n-3));
  const x=i=>padL+ (W-padL-8)*(i+0.5)/n; const y=v=>padT+(Hh-padB-padT)*(1-v/maxY);
  let g='';
  [[6,'주의'],[12,'경고']].forEach(([v,t])=>{ g+=`<line x1="${padL}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-dasharray="3 3"/><text x="${W-4}" y="${y(v)-3}" font-size="10" fill="var(--muted-fg)" text-anchor="end">${t} ${v}</text>`; });
  g+=`<line x1="${padL}" x2="${W-4}" y1="${y(0)}" y2="${y(0)}" stroke="var(--border)"/>`;
  rows.forEach((r,i)=>{ const h=Math.max(1,y(0)-y(r.score)); g+=`<rect data-i="${i}" x="${x(i)-bw/2}" y="${y(r.score)}" width="${bw}" height="${h}" rx="3" fill="var(--primary)"/>`; });
  rows.forEach((r,i)=>{ if(i===0||i===rows.length-1||i%7===0) g+=`<text x="${x(i)}" y="${Hh-4}" font-size="10" fill="var(--muted-fg)" text-anchor="middle">${r.date.slice(5).replace('-','/')}</text>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${g}</svg><div class="tip" id="tip"></div>`;
  const tip=$('tip'); const svg=el.querySelector('svg');
  const show=e=>{ const t=e.target.closest('rect'); if(!t){tip.style.display='none';return;} const r=rows[+t.dataset.i]; const b=el.getBoundingClientRect(); const rb=t.getBoundingClientRect();
    tip.textContent=`${r.date.slice(5)} · ${r.score}점 ${r.phase}`; tip.style.left=(rb.left-b.left+rb.width/2)+'px'; tip.style.top=(rb.top-b.top)+'px'; tip.style.display='block'; };
  svg.addEventListener('mousemove',show); svg.addEventListener('click',show); svg.addEventListener('mouseleave',()=>tip.style.display='none');
})();

$('foot').innerHTML = `생성 ${esc(D.generated_at)} (KST) · 기준일은 지표마다 다름(타일에 표시) · 점수: 정상 0 · 주의 1 · 경고 2를 12개 지표에 매겨 합산 · 투자 조언 아님`;
</script>
</body>
</html>
